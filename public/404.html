<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <title>404 Not Found — Airwaves</title>
    <style>
      body {
        margin: 0;
        background-color: #0f1115;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .card {
        max-width: 28rem;
        background: #181a24;
        border: 1px solid #262838;
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .badge {
        display: inline-block;
        font-family: monospace;
        font-size: 0.75rem;
        color: #f59e0b;
        background: rgba(245, 158, 11, 0.1);
        border: 1px solid rgba(245, 158, 11, 0.3);
        padding: 0.25rem 0.75rem;
        border-radius: 0.375rem;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 1rem;
      }
      h1 {
        color: #ffffff;
        font-size: 1.75rem;
        margin: 0 0 0.75rem 0;
        letter-spacing: -0.025em;
      }
      p {
        color: #94a3b8;
        font-size: 0.875rem;
        line-height: 1.6;
        margin: 0 0 2rem 0;
      }
      a {
        display: inline-block;
        background: #f59e0b;
        color: #090a0f;
        font-weight: 600;
        font-size: 0.875rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      a:hover {
        background: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">404 · Off-Air</span>
      <h1>Audio feed not found</h1>
      <p>The frequency or station page you requested could not be located on the directory.</p>
      <a href="/">Return to Airwaves directory</a>
    </div>
  </body>
</html>
